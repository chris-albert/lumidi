name: Deploy web site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "ableton/**"
      - "hardware/teensy/circuit.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add downloadable device + circuit diagram to the site
        run: |
          python3 ableton/build_amxd.py
          cp ableton/LumiDI.amxd web/LumiDI.amxd
          cp ableton/lumidi-engine.js web/lumidi-engine.js
          cp hardware/teensy/circuit.svg web/circuit.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
