<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="monospace" font-size="13">
  <style>
    .wire { stroke: #222; stroke-width: 2; fill: none; }
    .pwr  { stroke: #c0392b; stroke-width: 2; fill: none; }
    .gnd  { stroke: #2c3e50; stroke-width: 2; fill: none; }
    .data { stroke: #2980b9; stroke-width: 2; fill: none; }
    .box  { fill: #fff; stroke: #222; stroke-width: 2; }
    .lbl  { fill: #222; }
    .pin  { fill: #fff; stroke: #222; stroke-width: 1.5; }
    .note { fill: #555; font-style: italic; }
    .title{ font-size: 18px; font-weight: bold; }
  </style>

  <text x="20" y="28" class="title">Teensy 4.0 driving WS2812B strip (19 px) — USB powered, no PSU</text>
  <text x="20" y="48" class="note">AL-WS2812B-150BK-WP — 5V, ~1.14A @ full white; USB port must supply ≥ 1 A (powered hub or USB-C)</text>

  <!-- ===== Teensy 4.0 ===== -->
  <rect x="60" y="120" width="180" height="240" rx="8" class="box"/>
  <text x="150" y="150" text-anchor="middle" font-weight="bold">Teensy 4.0</text>

  <!-- USB power inlet (left side) -->
  <rect x="20" y="160" width="40" height="30" class="box"/>
  <text x="40" y="180" text-anchor="middle" font-size="11">USB</text>
  <text x="40" y="208" text-anchor="middle" class="note" font-size="11">5V in</text>

  <!-- Teensy pins -->
  <circle cx="240" cy="200" r="4" class="pin"/>
  <text x="232" y="195" text-anchor="end">Pin 7 (DOUT)</text>

  <circle cx="240" cy="240" r="4" class="pin"/>
  <text x="232" y="235" text-anchor="end">VIN (USB 5V)</text>

  <circle cx="240" cy="280" r="4" class="pin"/>
  <text x="232" y="275" text-anchor="end">GND</text>

  <text x="150" y="380" text-anchor="middle" class="note" font-size="11">VIN carries the USB 5V —</text>
  <text x="150" y="394" text-anchor="middle" class="note" font-size="11">leave the VUSB/VIN trace uncut</text>

  <!-- ===== WS2812B Strip ===== -->
  <rect x="640" y="120" width="220" height="320" rx="8" class="box"/>
  <text x="750" y="150" text-anchor="middle" font-weight="bold">WS2812B Strip</text>
  <text x="750" y="170" text-anchor="middle" class="note">19 pixels</text>

  <!-- LED dots -->
  <g>
    <circle cx="675" cy="220" r="8" fill="#e74c3c" stroke="#222"/>
    <circle cx="705" cy="220" r="8" fill="#27ae60" stroke="#222"/>
    <circle cx="735" cy="220" r="8" fill="#2980b9" stroke="#222"/>
    <text x="780" y="225" class="note">… 19 LEDs</text>
    <circle cx="825" cy="220" r="8" fill="#f1c40f" stroke="#222"/>
  </g>

  <!-- Strip input pins -->
  <circle cx="640" cy="270" r="4" class="pin"/>
  <text x="650" y="265">DIN</text>

  <circle cx="640" cy="330" r="4" class="pin"/>
  <text x="650" y="325">VDD (+5V)</text>

  <circle cx="640" cy="390" r="4" class="pin"/>
  <text x="650" y="385">GND</text>

  <!-- ===== Data line: Teensy DOUT -> 330Ω -> DIN ===== -->
  <path class="data" d="M 240 200 L 360 200"/>
  <!-- Resistor (zig-zag) -->
  <polyline class="data" points="360,200 370,190 385,210 400,190 415,210 430,190 440,200"/>
  <text x="395" y="180" text-anchor="middle">330 Ω</text>
  <path class="data" d="M 440 200 L 560 200 L 560 270 L 640 270"/>

  <!-- ===== +5V rail: Teensy VIN -> cap+ -> VDD ===== -->
  <path class="pwr" d="M 240 240 L 500 240 L 500 330 L 640 330"/>
  <text x="320" y="258" class="note">+5V rail (from USB via VIN)</text>

  <!-- Capacitor across +5V and GND near strip -->
  <!-- + plate -->
  <line class="pwr" x1="560" y1="330" x2="560" y2="370" stroke="#c0392b" stroke-width="2"/>
  <line class="pwr" x1="545" y1="370" x2="575" y2="370" stroke="#c0392b" stroke-width="2"/>
  <!-- - plate (curved) -->
  <path class="gnd" d="M 543 378 Q 560 388 577 378"/>
  <line class="gnd" x1="560" y1="388" x2="560" y2="410" stroke="#2c3e50" stroke-width="2"/>
  <text x="535" y="378" text-anchor="end">100 µF – 1000 µF</text>
  <text x="535" y="394" text-anchor="end" class="note">6.3 V or higher, near strip</text>
  <!-- + symbol -->
  <text x="540" y="345" fill="#c0392b">+</text>

  <!-- Tie cap top to +5V rail at junction -->
  <circle cx="560" cy="330" r="3" fill="#222"/>

  <!-- ===== GND rail ===== -->
  <!-- Strip GND -> common -->
  <path class="gnd" d="M 640 390 L 560 390"/>
  <!-- cap bottom already at (560,410); continue down -->
  <path class="gnd" d="M 560 410 L 560 440 L 320 440"/>
  <!-- Teensy GND -> common -->
  <path class="gnd" d="M 240 280 L 320 280 L 320 440"/>
  <circle cx="320" cy="440" r="3" fill="#222"/>
  <circle cx="560" cy="440" r="3" fill="#222"/>
  <text x="330" y="460" class="note">Common GND (Teensy + Strip)</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(60,495)">
    <line x1="0" y1="-4" x2="30" y2="-4" class="pwr"/>
    <text x="38" y="0">+5V</text>
    <line x1="90" y1="-4" x2="120" y2="-4" class="gnd"/>
    <text x="128" y="0">GND</text>
    <line x1="190" y1="-4" x2="220" y2="-4" class="data"/>
    <text x="228" y="0">Data (3.3 V logic)</text>
  </g>
</svg>
