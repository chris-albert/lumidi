<?xml version="1.0" encoding="UTF-8"?>
<!-- Illustration of the LumiDI Max for Live device, drawn from lumidi.maxpat's
     presentation layout. Swap this <img> target for a real screenshot any time. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 118" font-family="-apple-system, 'Segoe UI', sans-serif">
  <!-- device frame -->
  <rect x="0.5" y="0.5" width="499" height="117" rx="4" fill="#303030" stroke="#181818"/>
  <!-- title bar -->
  <path d="M 0.5 4.5 A 4 4 0 0 1 4.5 0.5 H 495.5 A 4 4 0 0 1 499.5 4.5 V 22 H 0.5 Z" fill="#3f3f3f"/>
  <circle cx="12" cy="11" r="5" fill="#ffb300"/>
  <text x="24" y="15" font-size="11" font-weight="600" fill="#e6e6e6">LumiDI</text>

  <!-- logo (fpic) -->
  <g transform="translate(8,31) scale(0.40625)">
    <circle cx="32" cy="32" r="28" fill="#1b2027" stroke="#454f5b" stroke-width="3"/>
    <rect x="29" y="51" width="6" height="7" rx="2" fill="#454f5b"/>
    <circle cx="17" cy="35" r="4.5" fill="#ff3b30"/>
    <circle cx="21.4" cy="24.4" r="4.5" fill="#ffb300"/>
    <circle cx="32" cy="20" r="4.5" fill="#34d158"/>
    <circle cx="42.6" cy="24.4" r="4.5" fill="#2fb6ff"/>
    <circle cx="47" cy="35" r="4.5" fill="#b45bff"/>
  </g>

  <!-- On toggle -->
  <rect x="40" y="36" width="15" height="15" rx="2" fill="#ffb300"/>
  <text x="59" y="47" font-size="10" fill="#c9c9c9">On</text>

  <!-- Anim menu -->
  <rect x="92" y="32" width="175" height="18" rx="2" fill="#1b1b1b" stroke="#555"/>
  <text x="100" y="45" font-size="11" fill="#e6e6e6">Rainbow</text>
  <path d="M 254 39 l 6 0 l -3 5 z" fill="#9a9a9a"/>

  <!-- Dir tabs -->
  <rect x="274" y="32" width="36" height="18" fill="#ffb300"/>
  <text x="292" y="45" font-size="10" text-anchor="middle" fill="#1b1b1b">Fwd</text>
  <rect x="310" y="32" width="36" height="18" fill="#1b1b1b" stroke="#555"/>
  <text x="328" y="45" font-size="10" text-anchor="middle" fill="#9a9a9a">Rev</text>

  <!-- swatch -->
  <rect x="357" y="32" width="48" height="48" rx="3" fill="#2b6fe0" stroke="#555"/>

  <!-- dials: Hue / Sat / Bright / Rate -->
  <g stroke-linecap="round">
    <!-- Hue, 60% -->
    <circle cx="30.5" cy="76" r="12" fill="#262626" stroke="#4a4a4a"/>
    <path d="M 22.01 84.49 A 12 12 0 1 1 38.99 84.49" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M 22.01 84.49 A 12 12 0 1 1 38.99 84.49" fill="none" stroke="#ffb300" stroke-width="2.5" pathLength="100" stroke-dasharray="60 100"/>
    <line x1="30.5" y1="76" x2="35.95" y2="65.31" stroke="#e6e6e6" stroke-width="2"/>
    <text x="30.5" y="107" font-size="10" text-anchor="middle" fill="#c9c9c9">Hue</text>
    <!-- Sat, 85% -->
    <circle cx="80.5" cy="76" r="12" fill="#262626" stroke="#4a4a4a"/>
    <path d="M 72.01 84.49 A 12 12 0 1 1 88.99 84.49" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M 72.01 84.49 A 12 12 0 1 1 88.99 84.49" fill="none" stroke="#ffb300" stroke-width="2.5" pathLength="100" stroke-dasharray="85 100"/>
    <line x1="80.5" y1="76" x2="92.46" y2="76.94" stroke="#e6e6e6" stroke-width="2"/>
    <text x="80.5" y="107" font-size="10" text-anchor="middle" fill="#c9c9c9">Sat</text>
    <!-- Bright, 90% -->
    <circle cx="130.5" cy="76" r="12" fill="#262626" stroke="#4a4a4a"/>
    <path d="M 122.01 84.49 A 12 12 0 1 1 138.99 84.49" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M 122.01 84.49 A 12 12 0 1 1 138.99 84.49" fill="none" stroke="#ffb300" stroke-width="2.5" pathLength="100" stroke-dasharray="90 100"/>
    <line x1="130.5" y1="76" x2="141.91" y2="79.71" stroke="#e6e6e6" stroke-width="2"/>
    <text x="130.5" y="107" font-size="10" text-anchor="middle" fill="#c9c9c9">Bright</text>
    <!-- Rate, 40% -->
    <circle cx="180.5" cy="76" r="12" fill="#262626" stroke="#4a4a4a"/>
    <path d="M 172.01 84.49 A 12 12 0 1 1 188.99 84.49" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M 172.01 84.49 A 12 12 0 1 1 188.99 84.49" fill="none" stroke="#ffb300" stroke-width="2.5" pathLength="100" stroke-dasharray="40 100"/>
    <line x1="180.5" y1="76" x2="175.05" y2="65.31" stroke="#e6e6e6" stroke-width="2"/>
    <text x="180.5" y="107" font-size="10" text-anchor="middle" fill="#c9c9c9">Rate</text>
  </g>

  <!-- Sync toggle + rate -->
  <rect x="218" y="78" width="15" height="15" rx="2" fill="#ffb300"/>
  <text x="237" y="89" font-size="10" fill="#c9c9c9">Sync</text>
  <rect x="277" y="78" width="70" height="15" rx="2" fill="#1b1b1b" stroke="#555"/>
  <text x="283" y="89" font-size="10" fill="#e6e6e6">1 bar</text>
  <path d="M 336 82 l 6 0 l -3 5 z" fill="#9a9a9a"/>

  <!-- debug readout -->
  <text x="410" y="42" font-size="9" fill="#8a8a8a">debug</text>
  <rect x="410" y="50" width="62" height="15" rx="2" fill="#1b1b1b" stroke="#444"/>
  <text x="468" y="61" font-size="10" text-anchor="end" fill="#ffb300" font-family="ui-monospace, Menlo, monospace">38412</text>
  <rect x="410" y="69" width="62" height="15" rx="2" fill="#1b1b1b" stroke="#444"/>
  <text x="468" y="80" font-size="10" text-anchor="end" fill="#ffb300" font-family="ui-monospace, Menlo, monospace">3542</text>
  <rect x="410" y="88" width="88" height="16" rx="2" fill="#1b1b1b" stroke="#444"/>
  <text x="416" y="99" font-size="10" fill="#c9c9c9" font-family="ui-monospace, Menlo, monospace">playing</text>
</svg>
