<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumiDI Strip Simulator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b0d10;
      color: #c9d1d9;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      background: #11151a;
      border-bottom: 1px solid #1f242b;
    }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    label { display: flex; align-items: center; gap: 8px; color: #8b949e; }
    select, input[type="number"] {
      background: #0b0d10;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 8px;
      font: inherit;
    }
    input[type="number"] { width: 64px; }
    #stats { margin-left: auto; color: #8b949e; font-variant-numeric: tabular-nums; }
    #strip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: 40px 30px;
      max-width: 100%;
    }
    .led {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgb(20, 20, 20);
      border: 1px solid #21262d;
      transition: background 40ms linear;
    }
    #log {
      width: 100%;
      box-sizing: border-box;
      height: 150px;
      overflow-y: auto;
      padding: 10px 20px;
      background: #0d1117;
      border-top: 1px solid #1f242b;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6e7681;
      white-space: pre;
    }
    #banner {
      padding: 10px 20px;
      background: #3d1d1d;
      color: #ff7b72;
      width: 100%;
      box-sizing: border-box;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>LumiDI Strip Simulator</h1>
    <label>MIDI input
      <select id="midi-input"><option value="">— none —</option></select>
    </label>
    <label>LEDs
      <input id="led-count" type="number" min="1" max="42" value="19">
    </label>
    <span id="stats">0.0 fps</span>
  </header>
  <div id="banner"></div>
  <div id="strip"></div>
  <div id="log"></div>
  <script src="simulator.js"></script>
</body>
</html>
