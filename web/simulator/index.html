<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>luMIDI Strip Simulator</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b0d10;
      color: #c9d1d9;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      background: #11151a;
      border-bottom: 1px solid #1f242b;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.02em;
    }
    h1 .midi {
      background: linear-gradient(90deg, #ff3b30, #ffb300, #34d158, #2fb6ff, #b45bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 a {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 .sub {
      font-size: 12px;
      font-weight: 400;
      color: #8b949e;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      align-self: flex-end;
      padding-bottom: 2px;
    }
    label { display: flex; align-items: center; gap: 8px; color: #8b949e; }
    select, input[type="number"], button {
      background: #0b0d10;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 8px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: #58a6ff; }
    #stats.warn { color: #ff7b72; }
    #color-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b949e;
      font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    #color-swatch {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid #30363d;
      background: rgb(0, 0, 0);
    }
    input[type="number"] { width: 64px; }
    #stats { margin-left: auto; color: #8b949e; font-variant-numeric: tabular-nums; }
    #strip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: 40px 30px;
      max-width: 100%;
    }
    .led {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgb(20, 20, 20);
      border: 1px solid #21262d;
      transition: background 40ms linear;
    }
    #log {
      width: 100%;
      box-sizing: border-box;
      height: 150px;
      overflow-y: auto;
      padding: 10px 20px;
      background: #0d1117;
      border-top: 1px solid #1f242b;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6e7681;
      white-space: pre;
    }
    #banner {
      padding: 10px 20px;
      background: #3d1d1d;
      color: #ff7b72;
      width: 100%;
      box-sizing: border-box;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <a href="../" title="luMIDI home">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="28" fill="#1b2027" stroke="#454f5b" stroke-width="3"/>
        <rect x="29" y="51" width="6" height="7" rx="2" fill="#454f5b"/>
        <circle cx="17" cy="35" r="7" fill="#ff3b30" opacity="0.3"/>
        <circle cx="17" cy="35" r="4.5" fill="#ff3b30"/>
        <circle cx="21.4" cy="24.4" r="7" fill="#ffb300" opacity="0.3"/>
        <circle cx="21.4" cy="24.4" r="4.5" fill="#ffb300"/>
        <circle cx="32" cy="20" r="7" fill="#34d158" opacity="0.3"/>
        <circle cx="32" cy="20" r="4.5" fill="#34d158"/>
        <circle cx="42.6" cy="24.4" r="7" fill="#2fb6ff" opacity="0.3"/>
        <circle cx="42.6" cy="24.4" r="4.5" fill="#2fb6ff"/>
        <circle cx="47" cy="35" r="7" fill="#b45bff" opacity="0.3"/>
        <circle cx="47" cy="35" r="4.5" fill="#b45bff"/>
      </svg>
      <span>lu<span class="midi">MIDI</span></span>
      </a>
      <span class="sub">strip simulator</span>
    </h1>
    <label>MIDI input
      <select id="midi-input"><option value="">— none —</option></select>
    </label>
    <label>LEDs
      <input id="led-count" type="number" min="1" max="42" value="19">
    </label>
    <button id="force-show" title="Manually latch the staged frame (what a note 127 would do)">Show</button>
    <span id="color-panel" title="Exact decoded color of LED 1 — compare against the device's Hue/Sat/Bright dials">
      <span id="color-swatch"></span>
      <span id="color-info">—</span>
    </span>
    <span id="stats">0 fps</span>
  </header>
  <div id="banner"></div>
  <div id="strip"></div>
  <div id="log"></div>
  <script src="simulator.js"></script>
</body>
</html>
